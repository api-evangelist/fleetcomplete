description: >-
  FinOps view of Fleet Complete spend. The dominant cost is the per-vehicle
  fleet management subscription (hardware plus software: GPS/telematics
  tracking, driver behavior, dispatch, geofencing, HOS/ELD compliance),
  quoted per fleet through direct sales rather than metered like typical
  developer-platform APIs. Standard access to the Unity GraphQL API and the
  legacy Integration WebAPI is bundled into that subscription at no separate
  charge. The only additional, separately billed line item identified is
  Professional Services work for custom integrations, fields, or endpoints
  beyond the standard surface.
notes: >-
  Per-vehicle subscription rates and Professional Services rates are not
  published; verify directly with Fleet Complete/Powerfleet sales. There is
  no per-API-call or per-token usage meter to reconcile, since API access
  itself is not billed separately from the fleet subscription.
