meters:
- name: vehicles_under_management
  description: Number of vehicles/assets enrolled on a Fleet Complete subscription, the primary driver of the monthly invoice.
  unit: vehicles
  aggregation: count
  dimensions:
  - account
  - fleet
- name: hardware_units
  description: Telematics devices and optional dash cams provisioned per vehicle, typically a one-time or amortized hardware cost.
  unit: devices
  aggregation: count
  dimensions:
  - account
  - fleet
- name: professional_services_hours
  description: Billable hours for Professional Services custom API/integration work, outside the standard free Unity/Integration WebAPI surface.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - engagement
principles:
- name: Visibility
  description: Track vehicles under management and any Professional Services engagements against the fleet subscription invoice; the Unity/Integration WebAPI usage itself carries no separate charge to monitor.
- name: Allocation
  description: Map per-vehicle subscription costs to fleets/departments using Unity API groups (getGroups) so spend maps to internal cost centers.
- name: Optimization
  description: Right-size the vehicle count under active subscription, and scope Professional Services requests narrowly (custom fields vs. full custom endpoints) to control one-off integration costs.
- name: Accountability
  description: Assign an internal owner for the fleet subscription contract and for any Professional Services statements of work; review counts and engagements at renewal.
