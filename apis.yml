name: Fleet Complete
kind: company
description: Fleet Complete (operating under parent company Powerfleet since its
  2024 rebrand) is a global connected commercial vehicle and mobile workforce
  management platform - GPS/telematics tracking, driver safety, dispatching,
  geofencing, and regulatory (HOS/ELD) compliance. Its current developer surface
  is the Unity API, a Bearer-token-authenticated GraphQL API at
  api.fleetcomplete.com/graphql covering vehicles, drivers/people, geofences,
  devices/cameras, groups/roles, and reports/work schedules with roughly 30
  queries and 22 mutations. Fleet Complete also still references an older,
  regionally hosted REST "Integration WebAPI" / EcoFleet-SeeMe surface
  (versioned v8_5_0/v8_6_1) covering vehicle trip history, tasks/dispatch, work
  schedules, and logbook reporting. Standard API access is provided free to
  existing Fleet Complete/Powerfleet clients; custom integrations built by
  Fleet Complete Professional Services carry additional fees.
